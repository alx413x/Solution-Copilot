[project]
name = "solution-copilot"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.5,<6",
  "redis>=5,<7",
  "boto3>=1.37,<2",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "pgvector>=0.4,<1",
  "jieba>=0.42,<1",
  "fastembed>=0.7,<1",
  "certifi>=2025.1.31",
]
[dependency-groups]
dev = ["ruff>=0.11,<1"]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/solution_copilot"]
[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
